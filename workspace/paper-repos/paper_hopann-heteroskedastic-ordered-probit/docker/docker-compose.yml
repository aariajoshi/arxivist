version: "3.9"

services:
  train:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: hopann:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ../data:/workspace/data
      - ../outputs:/workspace/outputs
    command: >
      python run_experiments.py
      --data-path /workspace/data/amazon_software_reviews.csv
      --output-dir /workspace/outputs
      --device cuda

  notebook:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: hopann:latest
    runtime: nvidia
    ports:
      - "8888:8888"
    volumes:
      - ../notebooks:/workspace/notebooks
      - ../data:/workspace/data
      - ../outputs:/workspace/outputs
    command: >
      jupyter notebook
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --notebook-dir=/workspace/notebooks
