model:
  d_model: 2560
  n_layer: 64
  expansion_factor: 2
  state_dimension_N: 16
  conv_kernel_size: 4 # ASSUMED: Standard practice in H3/Mamba for sequence modeling

training:
  optimizer: "AdamW"
  learning_rate: 0.002
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  batch_size: 1024 # ASSUMED: Mentioned in DNA modeling and implied by token counts
  training_steps: 200000
  mixed_precision: "bfloat16" # ASSUMED: inferred from bf16 mentions
  gradient_clipping: 0.1
  deterministic: false # Note: setting to true may slow down training

data:
  dataset_name: "The Pile"
  seq_length: 2048

evaluation:
  metrics: ["Perplexity", "Accuracy"]

hardware:
  device: "cuda"
  num_workers: 8
